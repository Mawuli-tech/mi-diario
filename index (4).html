<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Lora:wght@400;500;600&family=DM+Sans:wght@400;500;600&family=EB+Garamond:wght@400;600&family=Playfair+Display:wght@400;600&family=Caveat:wght@400;600&family=Dancing+Script:wght@400;600&family=Satisfy&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4e1e7;--paper:#fff9fa;--head:#4a1f3d;--accent:#9b5b7a;--line:#e6c9d3;--ink:#2e1a2a;--panel:#fdeef2;--side:#4a1f3d;--sidetext:#f7e8ee;--sideline:#6a3a5a;--sideon:#5d2d4d;--sidemuted:#7a4a68;--sidesoft:#c9a3b6;--newbg:#f4e1e7;--newfg:#4a1f3d;--fill:#4a1f3d;--fillfg:#fff}
[data-theme=lavender]{--bg:#ece6f4;--paper:#fbf9ff;--head:#3b2a5c;--accent:#7d68a8;--line:#d8cdea;--ink:#271e3a;--panel:#f1ebfa;--side:#3b2a5c;--sidetext:#f1ecfa;--sideline:#54427a;--sideon:#4a3870;--sidemuted:#6e5b96;--sidesoft:#beb0dc;--newbg:#ece6f4;--newfg:#3b2a5c;--fill:#3b2a5c}
[data-theme=sage]{--bg:#e3ece4;--paper:#fafdf9;--head:#2f4a3b;--accent:#4f7a60;--line:#c8dccb;--ink:#1f2e25;--panel:#edf5ee;--side:#2f4a3b;--sidetext:#eef6ef;--sideline:#46634f;--sideon:#3d5a49;--sidemuted:#5b7a66;--sidesoft:#b3cdb9;--newbg:#e3ece4;--newfg:#2f4a3b;--fill:#2f4a3b}
[data-theme=dark]{color-scheme:dark;--bg:#1b1219;--paper:#261a24;--head:#f0d3df;--accent:#c58aa6;--line:#4a3346;--ink:#f1e6ec;--panel:#33232f;--side:#120b11;--sidetext:#f1e6ec;--sideline:#3a2837;--sideon:#2d1d2a;--sidemuted:#5a4156;--sidesoft:#a98a9c;--newbg:#e9c9d8;--newfg:#2b1226;--fill:#c58aa6;--fillfg:#1b1219}
[data-theme=navy]{--bg:#e4e9f1;--paper:#fafbfd;--head:#1c2f4f;--accent:#4a6a9a;--line:#cbd5e4;--ink:#1b2433;--panel:#eef2f8;--side:#1c2f4f;--sidetext:#eaf0f8;--sideline:#34496d;--sideon:#2a4065;--sidemuted:#4d648a;--sidesoft:#a9bad5;--newbg:#e4e9f1;--newfg:#1c2f4f;--fill:#1c2f4f}
[data-theme=slate]{--bg:#e8e9eb;--paper:#fbfbfb;--head:#2d3239;--accent:#5d6773;--line:#d3d6da;--ink:#22262b;--panel:#f1f2f3;--side:#2d3239;--sidetext:#eef0f2;--sideline:#454c55;--sideon:#3b424b;--sidemuted:#5d6773;--sidesoft:#aeb5be;--newbg:#e8e9eb;--newfg:#2d3239;--fill:#2d3239}
[data-theme=wine]{--bg:#f1e2e4;--paper:#fffafa;--head:#5a1f2b;--accent:#94485a;--line:#e4c8ce;--ink:#2c1a1d;--panel:#fbecee;--side:#5a1f2b;--sidetext:#f8e9ec;--sideline:#7a3a47;--sideon:#6c2e3b;--sidemuted:#8c4a58;--sidesoft:#d3a3ae;--newbg:#f1e2e4;--newfg:#5a1f2b;--fill:#5a1f2b}
[data-theme=teal]{--bg:#dfeeed;--paper:#f9fdfd;--head:#14504f;--accent:#3b7f7c;--line:#c2dedc;--ink:#172b2b;--panel:#eaf6f5;--side:#14504f;--sidetext:#e8f6f5;--sideline:#2c6c6a;--sideon:#235e5c;--sidemuted:#3f7a78;--sidesoft:#9ccbc8;--newbg:#dfeeed;--newfg:#14504f;--fill:#14504f}
[data-theme=rosegold]{--bg:#f6e4df;--paper:#fffaf8;--head:#6b3a32;--accent:#a2655a;--line:#ecd2cb;--ink:#33211e;--panel:#fcefeb;--side:#6b3a32;--sidetext:#fbeeea;--sideline:#8a574d;--sideon:#7b4a41;--sidemuted:#9a665b;--sidesoft:#dcb1a8;--newbg:#f6e4df;--newfg:#6b3a32;--fill:#6b3a32}
[data-theme=sand]{--bg:#eee7dc;--paper:#fdfbf7;--head:#4a3c28;--accent:#7d6a4c;--line:#ddd2c0;--ink:#2a2419;--panel:#f6f1e8;--side:#4a3c28;--sidetext:#f5efe4;--sideline:#66553c;--sideon:#5a4a33;--sidemuted:#7d6a4c;--sidesoft:#c3b394;--newbg:#eee7dc;--newfg:#4a3c28;--fill:#4a3c28}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;display:flex}
button,select,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{width:300px;background:var(--side);color:var(--sidetext);display:flex;flex-direction:column;padding:24px 20px;flex-shrink:0}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.logo{font-family:'Great Vibes',cursive;font-size:44px;line-height:1;margin:0 0 4px;font-weight:400}
.tag{font-family:'Cormorant Garamond',serif;font-size:17px;opacity:.75;margin:0 0 20px}
.hamb{width:44px;height:44px;border-radius:50%;border:1px solid var(--sidemuted);background:none;color:var(--sidetext);display:flex;align-items:center;justify-content:center}
.new{background:var(--newbg);color:var(--newfg);border:0;border-radius:999px;padding:11px 18px;font-weight:500}
.tools{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-top:1px solid var(--sideline);border-bottom:1px solid var(--sideline);margin-top:14px}
.micbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--sidemuted);background:transparent;color:var(--sidetext);display:flex;align-items:center;justify-content:center}
.micbtn.rec{background:#b3345f;border-color:#b3345f;color:#fff}
.tg{position:relative;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
.tg input{position:absolute;opacity:0;width:44px;height:24px;right:0;margin:0;cursor:pointer}
.tg i{width:44px;height:24px;border-radius:999px;background:var(--sidemuted);position:relative;transition:background .2s;flex-shrink:0}
.tg i::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tg input:checked+i{background:var(--newbg)}
.tg input:checked+i::after{transform:translateX(20px);background:var(--side)}
.tg input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:inherit;text-decoration:underline;padding:0;font-size:inherit}
#showing{font-size:13px;color:var(--sidesoft);margin-top:12px}
#search{margin:14px 0 10px;background:transparent;border:1px solid var(--sidemuted);border-radius:999px;padding:10px 16px;color:var(--sidetext)}
#search::placeholder{color:var(--sidesoft)}
#list{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#list li button{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--sideline);color:inherit;padding:13px 4px}
#list li.on button{background:var(--sideon)}
#list b{display:block;font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600}
#list small{opacity:.7}
.grp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sidesoft);padding:12px 4px 4px}
.empty{opacity:.7;padding:14px 4px;font-family:'Cormorant Garamond',serif;font-size:18px}
body.hide #list b{filter:blur(6px)}
body.hide #list button:hover b,body.hide #list button:focus-visible b,body.hide #list li.on b{filter:none}
main{flex:1;display:flex;justify-content:center;padding:32px 20px;overflow:auto}
.page{position:relative;overflow:hidden;background:var(--paper);width:100%;max-width:760px;border-radius:6px;box-shadow:0 18px 40px -22px #000a;padding:34px 40px;display:flex;flex-direction:column;min-height:0}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.bar .sp{flex:1}
.bar span{color:var(--accent);font-size:14px}
#wc:not(:empty)::before{content:'· '}
.btn{background:none;border:1px solid var(--accent);color:var(--head);border-radius:999px;padding:8px 16px;font-size:14px}
.btn.fill{background:var(--fill);color:var(--fillfg);border-color:var(--fill)}
.btn[aria-pressed=true]{background:var(--panel)}
#title{border:0;background:none;font-family:var(--f,'Lora',serif);font-size:calc(40px*var(--fs,1));font-weight:var(--fw,600);color:var(--head);padding:0 0 10px;border-bottom:1px solid var(--line);width:100%}
#tag{border:0;background:none;color:var(--accent);padding:10px 0 0;flex:1;min-width:0;font-size:14px}
#tag::placeholder{color:var(--accent);opacity:.7}
.moods{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 0}
.chip{background:none;border:1px solid var(--line);color:var(--head);border-radius:999px;padding:5px 13px;font-size:13px}
.chip[aria-pressed=true]{background:var(--fill);color:var(--fillfg);border-color:var(--fill)}
#idea{display:none;gap:12px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin-top:12px;font-family:'Lora',serif;font-size:15px}
#idea .link{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--accent)}
#body{flex:1;min-height:320px;border:0;background:none;resize:none;font-family:var(--f,'Lora',serif);font-size:calc(18px*var(--fs,1));line-height:1.85;color:var(--ink);padding:18px 0;width:100%;max-width:68ch}
#polish{display:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-top:8px}
#polish p{font-family:'Lora',serif;line-height:1.7;margin:0 0 12px;white-space:pre-wrap}
#msg{color:#b3345f;font-size:14px;min-height:18px;margin-top:6px}
.none{margin:auto;text-align:center;font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--head)}
.ih{font-family:'Cormorant Garamond',serif;font-size:36px;color:var(--head);margin:0 0 18px;font-weight:600}
.ih2{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--head);margin:22px 0 8px;font-weight:600}
.stats{display:flex;gap:14px;flex-wrap:wrap}
.stats div{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;text-align:center}
.stats b{display:block;font-family:'Cormorant Garamond',serif;font-size:38px;color:var(--head)}
.stats span,.note{color:var(--accent);font-size:14px}
.mrow{display:flex;align-items:center;gap:12px;margin:8px 0}
.mrow span{width:84px;font-size:14px}
.mbar{flex:1;height:10px;background:var(--panel);border-radius:999px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent)}
.mrow em{width:24px;font-style:normal;font-size:14px;color:var(--accent)}
.logo{animation:write 2.2s cubic-bezier(.4,0,.2,1) .2s both,glow 5s ease-in-out 3.2s infinite}
@keyframes write{from{clip-path:inset(-24px 100% -24px 0)}to{clip-path:inset(-24px -24px -24px 0)}}
@keyframes glow{0%,100%{text-shadow:0 0 0 transparent}50%{text-shadow:0 0 18px currentColor}}
.orn{height:1px;width:0;margin:2px 0 8px;background:linear-gradient(90deg,currentColor,transparent);opacity:.5;animation:grow 1.4s ease 1.2s forwards}
@keyframes grow{to{width:100%}}
.tag{opacity:0;animation:fade 1s ease 1.5s forwards}
@keyframes fade{to{opacity:.75}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}.orn{animation:none;width:100%}.tag{animation:none;opacity:.75}}
.page>*{position:relative;z-index:1}
.page>.deco{position:absolute;z-index:0;width:300px;height:300px;color:var(--accent);opacity:.15;pointer-events:none}
.deco.br{right:-24px;bottom:-24px}
.deco.tl{left:-24px;top:-24px}
.deco.rot{transform:rotate(180deg)}
.cl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);align-self:center;min-width:48px}
.row2{display:flex;gap:10px;align-items:center}
#font{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 10px;font-size:13px;margin-top:10px;max-width:170px}
#scrim{position:fixed;inset:0;background:#0008;z-index:20}
.menu{position:fixed;left:0;top:0;bottom:0;width:340px;max-width:100%;background:var(--paper);color:var(--ink);z-index:30;overflow:auto;padding:22px 24px 40px;box-shadow:12px 0 40px -20px #000}
.menu h2{font-family:'Cormorant Garamond',serif;font-size:32px;color:var(--head);margin:0;font-weight:600}
.mh{display:flex;justify-content:space-between;align-items:center}
.menu h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:24px 0 4px;font-weight:500}
.menu .tg{justify-content:space-between;width:100%;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.menu .tg i{background:var(--line)}
.menu .tg input:checked+i{background:var(--accent)}
.menu .tg input:checked+i::after{background:#fff}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;color:var(--ink);font-size:15px}
.mi:hover{background:var(--panel)}
.sel{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.sel select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:170px}
.themes{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}.themes span{display:block;margin-bottom:8px}
.themes div{display:flex;flex-wrap:wrap;gap:12px}
.sw{width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);padding:0}
.sw[aria-pressed=true]{outline:2px solid var(--head);outline-offset:2px}
#pinform{padding:12px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#pinform input,#lpin{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:9px 12px}
#pinmsg{font-size:13px;color:var(--accent);width:100%}
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
#lock .logo{font-size:64px;color:var(--head)}
#lock p{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--head);margin:6px 0 18px}
#lerr{color:#b3345f;min-height:22px;margin-top:10px;font-size:14px}
.locked aside,.locked main,.locked .menu,.locked #scrim{visibility:hidden}
#exitf{display:none;position:fixed;top:14px;right:14px;z-index:10}
body.focus aside{display:none}
body.focus #exitf{display:block}
#pa{display:none}
@media print{body>*:not(#pa){display:none!important}#pa{display:block;color:#000;font-family:'Lora',serif}#pa p{white-space:pre-wrap;line-height:1.7}}
@media(max-width:800px){body{flex-direction:column;height:auto;min-height:100%}aside{width:100%;padding:18px}#list{max-height:170px}.page{padding:22px 18px}#title{font-size:calc(32px*var(--fs,1))}}
</style>
</head>
<body>
<aside>
  <div class="top"><h1 class="logo">Mi Diario</h1>
    <button class="hamb" id="hamb" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
  <div class="orn" aria-hidden="true"></div>
  <p class="tag">My words, kept safe.</p>
  <button class="new" id="new">New note</button>
  <div class="tools">
    <button class="micbtn" id="mic" aria-label="Voice typing" aria-pressed="false" title="Voice typing"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <label class="tg"><span>AI</span><input type="checkbox" id="ai"><i></i></label>
  </div>
  <div id="showing"></div>
  <input id="search" type="search" placeholder="Search notes" aria-label="Search notes">
  <ul id="list"></ul>
</aside>
<main><section class="page" id="page"></section></main>

<div id="scrim" hidden></div>
<nav class="menu" id="menu" role="dialog" aria-label="Menu" hidden>
  <div class="mh"><h2>Menu</h2><button class="btn" id="mclose">Close</button></div>
  <h3>Appearance</h3>
  <div id="themeBox"></div>
  <h3>Writing</h3>
  <label class="tg"><span>Show word count</span><input type="checkbox" id="s-words"><i></i></label>
  <button class="mi" id="m-idea">Need an idea?</button>
  <button class="mi" id="m-focus">Focus mode</button>
  <h3>Organise</h3>
  <label class="sel">Show<select id="s-filter"></select></label>
  <label class="tg"><span>Group by month</span><input type="checkbox" id="s-group"><i></i></label>
  <h3>Privacy</h3>
  <label class="tg"><span>Hide note titles in list</span><input type="checkbox" id="s-hide"><i></i></label>
  <button class="mi" id="m-pin">Set PIN</button>
  <form id="pinform" hidden><input id="pin1" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="4 to 8 digits" aria-label="New PIN"><button class="btn fill" type="submit">Save PIN</button><span id="pinmsg" role="status"></span></form>
  <button class="mi" id="m-lock">Lock now</button>
  <button class="mi" id="m-unpin">Remove PIN</button>
  <h3>Your notes</h3>
  <button class="mi" id="m-ins">Insights</button>
  <button class="mi" id="m-exp">Download backup</button>
  <button class="mi" id="m-imp">Restore from backup</button>
  <input type="file" id="impf" accept=".json,application/json" hidden>
  <button class="mi" id="m-print">Print or save note as PDF</button>
</nav>
<button class="btn fill" id="exitf">Exit focus mode</button>
<div id="lock" hidden><form id="lform"><h1 class="logo">Mi Diario</h1><div class="orn" aria-hidden="true"></div><p>Enter your PIN to open your notes.</p><input id="lpin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN"> <button class="btn fill" type="submit">Unlock</button><div id="lerr" role="alert"></div></form></div>
<div id="pa"></div>
<script>
let entries=[],cur=null,timer,rec=null,aiOn=true,theme='blush',pin=null,lastFocus,S={words:true,hide:false,group:false,filter:'all'};
const $=id=>document.getElementById(id);
const MOODS=['Happy','Calm','Grateful','Hopeful','Tired','Anxious','Sad','Angry'];
const IDEAS=['What made you smile today?','What are you grateful for right now?','Describe a moment this week you want to remember.','What is one thing you are proud of recently?','What is weighing on your mind, and what would help?','Write a letter to yourself one year from now.','What does a perfect ordinary day look like for you?','Who helped you recently, and how?','What are you looking forward to?','What did you learn this week?','What would you do if you were not afraid?','Describe this season of your life in three sentences.'];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function load(){
  try{entries=JSON.parse(lsGet('mi-diario')||'[]')}catch(e){entries=[]}
  try{Object.assign(S,JSON.parse(lsGet('mi-diario-set')||'{}'))}catch(e){}
  try{pin=JSON.parse(lsGet('mi-diario-pin')||'null')}catch(e){}
  aiOn=lsGet('mi-diario-ai')!=='off';theme=lsGet('mi-diario-theme')||'blush';
}
function save(){return lsSet('mi-diario',JSON.stringify(entries))}
function saveS(){lsSet('mi-diario-set',JSON.stringify(S))}
function get(){return entries.find(e=>e.id===cur)}
function fmt(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function dayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function tags(){return [...new Set(entries.map(e=>(e.tag||'').trim()).filter(Boolean))].sort()}

function streaks(){
  const days=[...new Set(entries.filter(e=>e.body.trim()).map(e=>dayStart(e.updated)))].sort((a,b)=>a-b);
  let best=0,run=0;
  days.forEach((d,i)=>{run=i&&Math.round((d-days[i-1])/864e5)===1?run+1:1;best=Math.max(best,run)});
  const set=new Set(days);let d=new Date(dayStart(Date.now())),now=0;
  if(!set.has(d.getTime()))d.setDate(d.getDate()-1);
  while(set.has(d.getTime())){now++;d.setDate(d.getDate()-1)}
  return{now,best};
}
function matchF(e,f){return f==='all'||(f==='pinned'?!!e.pin:f.startsWith('topic:')?e.topic===f.slice(6):(e.tag||'')===f.slice(4))}
function fixFilter(){const f=S.filter;if((f.startsWith('tag:')&&!tags().includes(f.slice(4)))||(f.startsWith('topic:')&&!entries.some(e=>e.topic===f.slice(6)))){S.filter='all';saveS()}}
function renderList(){
  fixFilter();
  const q=$('search').value.toLowerCase(),f=S.filter;

function printNote(){
  const e=get();if(!e){alert('Open a note first.');return}
  $('pa').style.fontFamily='"'+(FONTS[e.font||'lora']||FONTS.lora).n+'", serif';$('pa').innerHTML='<h1>'+esc(e.title||'Untitled')+'</h1><small>'+fmt(e.updated)+'</small><p>'+esc(e.body)+'</p>';window.print();
}

/* wiring */
$('ai').onchange=()=>{aiOn=$('ai').checked;lsSet('mi-diario-ai',aiOn?'on':'off');applyAi();const p=$('polish');if(p&&!aiOn)p.style.display='none'};
$('mic').onclick=toggleMic;
$('new').onclick=newEntry;
$('search').oninput=renderList;
$('list').onclick=ev=>{const b=ev.target.closest('button');if(b)select(b.dataset.id)};
$('showing').onclick=ev=>{if(ev.target.id==='clr'){S.filter='all';saveS();renderList()}};
$('hamb').onclick=openMenu;$('mclose').onclick=closeMenu;$('scrim').onclick=closeMenu;
$('themeBox').onclick=ev=>{const b=ev.target.closest('.sw');if(b)setTheme(b.dataset.t)};
$('s-words').onchange=()=>{S.words=$('s-words').checked;saveS();wcUpdate()};
$('s-hide').onchange=()=>{S.hide=$('s-hide').checked;saveS();applySettings()};
$('s-group').onchange=()=>{S.group=$('s-group').checked;saveS();renderList()};
$('s-filter').onchange=()=>{S.filter=$('s-filter').value;saveS();renderList()};
$('m-idea').onclick=()=>done(showIdea);
$('m-focus').onclick=()=>done(()=>{if(!get())newEntry();focusMode(true)});
$('exitf').onclick=()=>focusMode(false);
$('m-ins').onclick=()=>done(showInsights);
$('m-exp').onclick=exportAll;
$('m-print').onclick=()=>done(printNote);
$('m-lock').onclick=()=>done(lockNow);
$('m-imp').onclick=()=>$('impf').click();
$('m-pin').onclick=()=>{$('pinform').hidden=false;$('pinmsg').textContent='';$('pin1').focus()};
$('m-unpin').onclick=()=>{if(confirm('Remove your PIN? Your notes will open without a code.')){pin=null;try{localStorage.removeItem('mi-diario-pin')}catch(e){}renderMenu()}};
$('pinform').onsubmit=async ev=>{
  ev.preventDefault();const v=$('pin1').value;
  if(!/^\d{4,8}$/.test(v)){$('pinmsg').textContent='Use 4 to 8 digits.';return}
  if(!(window.crypto&&crypto.subtle)){$('pinmsg').textContent='A PIN needs a secure (https) page.';return}
  const salt=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');
  pin={salt,hash:await hashPin(v,salt)};lsSet('mi-diario-pin',JSON.stringify(pin));
  $('pin1').value='';renderMenu();$('pinform').hidden=false;$('pinmsg').textContent='PIN saved. Download a backup too, in case you forget it.';
};
$('lform').onsubmit=async ev=>{
  ev.preventDefault();
  if(await hashPin($('lpin').value,pin.salt)===pin.hash){document.body.classList.remove('locked');$('lock').hidden=true}
  else{$('lerr').textContent='That PIN is not right.';$('lpin').value='';$('lpin').focus()}
};
$('impf').onchange=async ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  try{
    const d=JSON.parse(await f.text()),inc=(d.entries||d).filter(x=>x&&typeof x.id==='string'&&typeof x.body==='string'),have=new Set(entries.map(e=>e.id));
    const add=inc.filter(x=>!have.has(x.id)).map(x=>({id:x.id,title:String(x.title||''),body:x.body,mood:x.mood||'',tag:x.tag||'',pin:!!x.pin,font:FONTS[x.font]?x.font:'lora',topic:TOPICS.includes(x.topic)?x.topic:'',updated:Number(x.updated)||Date.now()}));
    entries.push(...add);save();renderList();renderMenu();
    alert(add.length+' notes restored. '+(inc.length-add.length)+' were already here.');
  }catch(e){alert('That file could not be read. Choose a Mi Diario backup file.')}
};
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('menu').hidden)closeMenu();else if(document.body.classList.contains('focus'))focusMode(false);
});

const THEMES=[['blush','Blush','#f4e1e7','Soft'],['lavender','Lavender','#b9a6e0','Soft'],['sage','Sage','#a8cbb2','Soft'],['rosegold','Rose gold','#d9a79d','Soft'],['navy','Navy','#1c2f4f','Professional'],['slate','Slate','#5d6773','Professional'],['wine','Wine','#7a2f3d','Professional'],['teal','Teal','#2f7f7c','Professional'],['sand','Sand','#c8b595','Professional'],['dark','Dark','#1b1219','Professional']];
$('themeBox').innerHTML=['Soft','Professional'].map(g=>`<div class="themes" role="group" aria-label="${g} themes"><span>${g}</span><div>${THEMES.filter(t=>t[3]===g).map(t=>`<button class="sw" data-t="${t[0]}" aria-label="${t[1]} theme" title="${t[1]}" style="background:${t[2]}"></button>`).join('')}</div></div>`).join('');
load();applySettings();setTheme(theme);$('ai').checked=aiOn;
renderList();renderPage();
if(pin)lockNow();
</script>
